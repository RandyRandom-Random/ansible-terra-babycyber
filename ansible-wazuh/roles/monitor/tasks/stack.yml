---
# stack.yml — Démarrage de la stack conteneurisée
# Tags : monitor, stack
# Le docker-compose monte Prometheus + Grafana + Node Exporter.
# Étape commune : appelée aussi bien par le playbook Prometheus que Grafana.

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitor_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull Docker images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ monitor_dir }}"
  register: docker_pull
  until: docker_pull.rc == 0
  retries: 3
  delay: 10
  changed_when: false

- name: Start Monitor stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ monitor_dir }}"
  changed_when: true

- name: Display access info
  ansible.builtin.debug:
    msg:
      - "Grafana    : http://192.168.50.11:3000  (admin / {{ grafana_admin_password }})"
      - "Prometheus : http://192.168.50.11:9090"
