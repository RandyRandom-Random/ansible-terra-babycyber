---
# stack.yml — Démarrage du conteneur (Prometheus OU Grafana selon la VM)
# Tags : monitor, stack
# Le docker-compose ne monte que le composant {{ monitor_component }}.
# Étape commune : appelée aussi bien par le playbook Prometheus que Grafana.

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitor_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull Docker images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ monitor_dir }}"
  register: docker_pull
  until: docker_pull.rc == 0
  retries: 3
  delay: 10
  changed_when: false

- name: Start Monitor stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ monitor_dir }}"
  changed_when: true

- name: Display access info (Prometheus)
  ansible.builtin.debug:
    msg: "Prometheus : http://{{ prometheus_ip }}:9090"
  when: monitor_component == 'prometheus'

- name: Display access info (Grafana)
  ansible.builtin.debug:
    msg: "Grafana : http://{{ grafana_ip }}:3000  (admin / {{ grafana_admin_password }})"
  when: monitor_component == 'grafana'
