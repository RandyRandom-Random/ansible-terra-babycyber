---
- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded

- name: restart auditd
  ansible.builtin.command: systemctl --no-block restart auditd
  changed_when: true

- name: update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
