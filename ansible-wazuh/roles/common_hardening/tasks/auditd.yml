---
# Auditd CIS-L1 (cf. CIS Debian Linux 12 Benchmark v1.0.0 — section 4.1)

- name: Configurer auditd.conf
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  notify: restart auditd

- name: Déployer les règles CIS-L1
  ansible.builtin.template:
    src: cis-l1.rules.j2
    dest: /etc/audit/rules.d/cis-l1.rules
    owner: root
    group: root
    mode: "0640"
  notify: restart auditd

- name: Activer auditd au boot
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet audit=1 audit_backlog_limit=8192"'
  register: grub_audit
  notify: update grub

- name: Activer et démarrer auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
