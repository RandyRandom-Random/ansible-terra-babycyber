---
- name: Déployer la config SSH durcie
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
    backup: true
  notify: restart sshd

- name: S'assurer qu'aucun fichier de drop-in ne ré-active des options
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d/
    patterns: "*.conf"
  register: ssh_dropins

- name: Désactiver les drop-ins SSH (on garde tout dans sshd_config)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ssh_dropins.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: restart sshd

- name: Désactiver les algorithmes faibles (ssh-rsa SHA1)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^HostKeyAlgorithms"
    line: "HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256,ecdsa-sha2-nistp521"
    state: present
  notify: restart sshd
