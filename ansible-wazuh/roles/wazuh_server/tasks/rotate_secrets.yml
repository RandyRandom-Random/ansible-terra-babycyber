---
# Rotation des mots de passe Wazuh (§7.1, §8.1).
# Appelé soit en bootstrap (1ère execution) soit en routine via
# playbooks/ops/rotate_secrets.yml.

- name: Vérifier que la stack est démarrée
  ansible.builtin.command:
    cmd: "{{ 'podman' if runtime_engine == 'podman' else 'docker' }} ps --format '{{ '{{' }}.Names{{ '}}' }}'"
  register: containers
  changed_when: false
  failed_when: false
  tags: [secrets, rotate]

- name: Générer de nouveaux secrets (32 chars, alphanumériques + symboles)
  ansible.builtin.set_fact:
    new_indexer_password: "{{ lookup('community.general.random_string', length=32, special=true, override_special='!@#$%^&*-_=+', min_lower=4, min_upper=4, min_numeric=4, min_special=2) }}"
    new_api_password: "{{ lookup('community.general.random_string', length=32, special=true, override_special='!@#$%^&*-_=+', min_lower=4, min_upper=4, min_numeric=4, min_special=2) }}"
    new_enrollment_password: "{{ lookup('community.general.random_string', length=48, special=false) }}"
  no_log: true
  tags: [secrets, rotate]

# ─── 1. Pousser les nouveaux secrets dans Vault ──────────────────────
- name: Pousser nouveau password indexer admin dans Vault
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    path: "{{ vault_secret_base }}/indexer/admin"
    data:
      data:
        password: "{{ new_indexer_password }}"
        rotated_at: "{{ ansible_date_time.iso8601 }}"
  delegate_to: localhost
  no_log: true
  tags: [secrets, rotate]

- name: Pousser nouveau password API dans Vault
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    path: "{{ vault_secret_base }}/api"
    data:
      data:
        password: "{{ new_api_password }}"
        rotated_at: "{{ ansible_date_time.iso8601 }}"
  delegate_to: localhost
  no_log: true
  tags: [secrets, rotate]

- name: Pousser nouveau enrollment password dans Vault
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    path: "{{ vault_secret_base }}/enrollment"
    data:
      data:
        password: "{{ new_enrollment_password }}"
        rotated_at: "{{ ansible_date_time.iso8601 }}"
  delegate_to: localhost
  no_log: true
  tags: [secrets, rotate]

# ─── 2. Appliquer côté Wazuh indexer (OpenSearch security API) ────────
- name: Hash du nouveau password indexer (bcrypt via Wazuh tool)
  ansible.builtin.command:
    cmd: "{{ 'podman' if runtime_engine == 'podman' else 'docker' }} exec single-node-wazuh.indexer-1 bash -c 'JAVA_HOME=/usr/share/wazuh-indexer/jdk /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p {{ new_indexer_password | quote }}'"
  register: indexer_hash
  changed_when: true
  no_log: true
  tags: [secrets, rotate, indexer]

- name: Patch internal_users.yml avec le nouveau hash
  ansible.builtin.lineinfile:
    path: "/etc/wazuh-indexer/opensearch-security/internal_users.yml"
    regexp: '^(\s*)hash: ".*"$'
    line: '\1hash: "{{ indexer_hash.stdout | trim }}"'
    backrefs: true
  no_log: true
  notify: restart wazuh indexer
  tags: [secrets, rotate, indexer]

- name: Recharger la config OpenSearch security
  ansible.builtin.command:
    cmd: "{{ 'podman' if runtime_engine == 'podman' else 'docker' }} exec single-node-wazuh.indexer-1 bash -c 'JAVA_HOME=/usr/share/wazuh-indexer/jdk OPENSEARCH_JAVA_HOME=/usr/share/wazuh-indexer/jdk /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh -cd /usr/share/wazuh-indexer/opensearch-security/ -nhnv -cacert /usr/share/wazuh-indexer/certs/root-ca.pem -cert /usr/share/wazuh-indexer/certs/admin.pem -key /usr/share/wazuh-indexer/certs/admin-key.pem'"
  changed_when: true
  tags: [secrets, rotate, indexer]

# ─── 3. API Wazuh (changer le mot de passe wazuh-wui) ──────────────
- name: Récupérer un token API avec l'ancien mot de passe
  ansible.builtin.uri:
    url: "https://{{ wazuh_manager_ip }}:{{ wazuh_api_port }}/security/user/authenticate"
    method: POST
    user: wazuh-wui
    password: "{{ old_api_password | default('wazuh-wui') }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: api_token
  no_log: true
  tags: [secrets, rotate, api]

- name: Changer le mot de passe wazuh-wui via API
  ansible.builtin.uri:
    url: "https://{{ wazuh_manager_ip }}:{{ wazuh_api_port }}/security/users/2"
    method: PUT
    headers:
      Authorization: "Bearer {{ api_token.json.data.token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      password: "{{ new_api_password }}"
    validate_certs: false
    status_code: [200]
  no_log: true
  tags: [secrets, rotate, api]

# ─── 4. Enrollment password (authd) ────────────────────────────────
- name: Mettre à jour /var/ossec/etc/authd.pass
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      {{ 'podman' if runtime_engine == 'podman' else 'docker' }} exec single-node-wazuh.manager-1 bash -c "echo -n '{{ new_enrollment_password }}' > /var/ossec/etc/authd.pass && chown wazuh:wazuh /var/ossec/etc/authd.pass && chmod 640 /var/ossec/etc/authd.pass"
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true
  notify: restart wazuh manager
  tags: [secrets, rotate, enrollment]

- name: Audit log
  ansible.builtin.debug:
    msg: "✓ Rotation terminée à {{ ansible_date_time.iso8601 }} — secrets stockés dans {{ vault_secret_base }}/*"
  tags: [secrets, rotate]
