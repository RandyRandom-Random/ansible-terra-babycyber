---
# Inventaire prod — segmentation par VLAN (cf. §5.2 du cahier des charges)
# Chaque hôte appartient à exactement UN groupe VLAN, et à un ou plusieurs
# groupes fonctionnels (wazuh_server, wazuh_agents, firewalls, …).

all:
  children:

    # ─────────────────────────── VLANs ───────────────────────────

    vlan_mgmt:
      # VLAN 10 — Management (Proxmox + pfSense)
      hosts:
        proxmox.mgmt.lan:
          ansible_host: 192.168.10.1
        pfsense.mgmt.lan:
          ansible_host: 192.168.10.254

    vlan_infra:
      # VLAN 20 — Infra (Vault, K3s, GitLab, Nexus, Authentik)
      hosts:
        vault.infra.lan:
          ansible_host: 192.168.20.13
        k3s-1.infra.lan:
          ansible_host: 192.168.20.20
        gitlab.infra.lan:
          ansible_host: 192.168.20.10
        nexus.infra.lan:
          ansible_host: 192.168.20.30
        authentik.infra.lan:
          ansible_host: 192.168.20.40

    vlan_runtime:
      # VLAN 30 — Runtime (Podman engine, fullstack app)
      hosts:
        podman-host.runtime.lan:
          ansible_host: 192.168.30.10
        app-fullstack.runtime.lan:
          ansible_host: 192.168.30.20

    vlan_dmz:
      # VLAN 40 — DMZ (reverse proxy)
      hosts:
        rproxy.dmz.lan:
          ansible_host: 192.168.40.10

    vlan_sec:
      # VLAN 50 — Sécurité / Observabilité (Wazuh, Grafana, VictoriaMetrics, VictoriaLogs)
      hosts:
        wazuh.sec.lan:
          ansible_host: 192.168.50.10
        grafana.sec.lan:
          ansible_host: 192.168.50.20

    # ─────────────────── Groupes fonctionnels ─────────────────────

    wazuh_server:
      hosts:
        wazuh.sec.lan:

    wazuh_agents:
      children:
        vlan_infra:
        vlan_runtime:
        vlan_dmz:
      hosts:
        pfsense.mgmt.lan:    # pfSense est aussi un agent (FreeBSD, v1.1)

    firewalls:
      hosts:
        pfsense.mgmt.lan:

    # ───────────────── Groupes Wazuh (profils §6.1) ───────────────

    infra_critical:
      # FIM agressif + SCA CIS Debian 12
      hosts:
        vault.infra.lan:
        gitlab.infra.lan:
        authentik.infra.lan:

    infra_k3s:
      # FIM /etc/rancher, audit API K8s
      hosts:
        k3s-1.infra.lan:

    infra_registry:
      # FIM configs Nexus, audit artefacts
      hosts:
        nexus.infra.lan:

    runtime:
      # FIM allégé, audit événements Podman
      hosts:
        podman-host.runtime.lan:
        app-fullstack.runtime.lan:

    dmz:
      # Logs HTTP, brute force, active response → fail2ban
      hosts:
        rproxy.dmz.lan:

    network:
      # pfSense — collecte logs (v1.1)
      hosts:
        pfsense.mgmt.lan:

    # ───────────────────── Monitoring (bonus) ─────────────────────
    # Hors cahier des charges v1.0 mais déjà déployé dans le lab.
    monitor:
      hosts:
        monitor.sec.lan:
          ansible_host: 192.168.50.11
