---
# 60_grafana.yml — Déploiement de GRAFANA (VM dédiée grafana.sec.lan)
# Tags : grafana
# Usage : ansible-playbook playbooks/60_grafana.yml
#
# Grafana lit la VM Prometheus (datasource auto-provisionnée vers
# http://192.168.50.11:9090) et affiche les dashboards. Écoute sur le port 3000.

- name: Grafana — visualisation / dashboards
  hosts: grafana_server
  become: true
  gather_facts: true
  tags: [grafana]
  vars:
    monitor_component: grafana
  tasks:
    - name: Prérequis communs (OS + Docker + firewall)
      ansible.builtin.include_role:
        name: monitor
        tasks_from: setup.yml

    - name: Provisioning Grafana (datasource Prometheus + dashboards)
      ansible.builtin.include_role:
        name: monitor
        tasks_from: grafana.yml

    - name: Démarrage du conteneur Grafana
      ansible.builtin.include_role:
        name: monitor
        tasks_from: stack.yml
