---
# ops/rotate_secrets.yml — Rotation trimestrielle des secrets (§7.1)
# Tags : rotate
# Usage : ansible-playbook playbooks/ops/rotate_secrets.yml

- name: Rotation des mots de passe Wazuh
  hosts: wazuh_server
  gather_facts: true
  vars_files:
    - ../../inventories/prod/group_vars/vault.yml
  tags: [rotate, secrets]

  tasks:
    - name: Récupérer l'ancien mot de passe API depuis Vault (pour pouvoir l'utiliser)
      ansible.builtin.set_fact:
        old_api_password: "{{ lookup('community.hashi_vault.hashi_vault', vault_secret_base + '/api:password url=' + vault_addr) }}"
      no_log: true

    - name: Inclure les tâches de rotation du rôle wazuh_server
      ansible.builtin.include_role:
        name: wazuh_server
        tasks_from: rotate_secrets.yml
